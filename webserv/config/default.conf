# webserv - Default Configuration
# An nginx-like configuration file for the 42 webserv project
#
# Directives:
#   listen          - Port to listen on
#   server_name     - Virtual host name
#   host            - Host IP address
#   root            - Document root directory
#   index           - Default file for directory requests
#   autoindex       - Enable/disable directory listing (on|off)
#   allow_methods   - Allowed HTTP methods (GET POST DELETE)
#   client_max_body_size - Maximum request body size in bytes
#   cgi_path        - CGI interpreter paths (space separated)
#   cgi_ext         - CGI file extensions (space separated)
#   return          - URL redirect
#   error_page      - Custom error page (code path)
#   upload_store    - Directory for uploaded files (POST destination)
#   client_timeout  - Max seconds to wait for complete request
#   keepalive_timeout - Max seconds idle before closing keep-alive

server {
    listen 8080;
    server_name localhost;
    host 127.0.0.1;
    root ./www;
    index index.html;
    client_max_body_size 10000000;
    client_timeout 60;
    keepalive_timeout 10;
	autoindex off;

    location / {
        allow_methods GET POST DELETE;
        autoindex on;
    }

    location /uploads {
        allow_methods GET POST DELETE;
        autoindex off;
        upload_store ./www/uploads;
    }

    location /files {
        allow_methods GET;
        autoindex on;
    }

    location /cgi-bin {
        allow_methods GET POST DELETE;
        autoindex on;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_ext .py .sh;
    }

    location /old_path {
        return /uploads;
    }
}

server { 
	listen 8081;
	server_name example.com;
    host 0.0.0.0;
    root ./www;
    index index.html;
    client_max_body_size 500000;
    client_timeout 30;
    keepalive_timeout 5;
    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;

    location / {
        allow_methods GET POST;
        autoindex on;
    }

    location /cgi-bin {
        allow_methods GET POST DELETE;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }
}
