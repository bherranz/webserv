# ==============================================================================
# Servidor 1: Servidor principal (Puerto 8080)
# ==============================================================================
server {
    listen 8080;
    server_name localhost;
	autoindex off;
    
    # Vuestras directivas personalizadas
    host 127.0.0.1;
    client_timeout 60;
    # keepalive_timeout 10;

    # Configuración global del servidor
    # root ./www/;
	 root ./www/; #shouldnt work because main doesnt exist as path, hence 404 // tira 200
	#
    index index.html index.html;
    client_max_body_size 5000000; # 5 MB

    # Páginas de error personalizadas
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Ruta básica
    location / {
        allow_methods GET POST;
        autoindex on;
    }

    # Ruta para probar el autoindex (listar directorio)
    location /assets {
        allow_methods GET;
    }

    # Ruta para subir y borrar archivos
    location /uploads {
        allow_methods GET POST DELETE;
        #autoindex on;
        upload_store ./www/main/uploads;
    }

    # Ruta para ejecutar scripts CGI
    location /cgi-bin {
        allow_methods GET POST;
        cgi_path /usr/bin/python3;
        cgi_ext .py;
    }

    # Ruta para probar la redirección HTTP
    location /google {
        return 301 http://www.google.com;
    }
}

# ==============================================================================
# Servidor 2: Servidor secundario (Puerto 8081)
# ==============================================================================
server {
    listen 8081;
    server_name example.com;

    host 0.0.0.0;

    root ./www/example;
    index default.html;
    client_max_body_size 1000000; # 1 MB

    location / {
        allow_methods GET;
        autoindex on;
    }

    # Redirección interna
    location /old_path {
        return 301 /;
    }
}