# ==============================================================================
# SERVIDOR 1: Servidor principal
# ==============================================================================
server {
    # NGINX estándar incluye la IP y el puerto en la misma directiva
    listen 127.0.0.1:8080;
    server_name webserv.local www.webserv.local;
    
    # Configuración global
    root ./www/html;
    index index.html index.htm;
    
    # Límite de tamaño del body (en bytes para que tu std::atol funcione directo)
    client_max_body_size 5000000;

    # Páginas de error por defecto
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # Ruta básica
    location / {
        allow_methods GET;
        autoindex off;
    }

    # Ruta para listado de directorios
    location /images {
        allow_methods GET;
        autoindex on;
        root ./www/assets;
    }

    # Ruta para subida y borrado de archivos
    location /upload {
        allow_methods GET POST DELETE;
        upload_store ./www/uploads;
        autoindex on;
    }

    # Ruta de ejecución CGI (Python y PHP)
    location /cgi-bin {
        allow_methods GET POST;
        cgi_ext .py .php;
        cgi_path /usr/bin/python3 /usr/bin/php-cgi;
    }
}

# ==============================================================================
# SERVIDOR 2: Servidor secundario para redirecciones
# ==============================================================================
server {
    # Si no se especifica IP, NGINX asume 0.0.0.0
    listen 8081;
    server_name redirect.local;

    client_max_body_size 1000000;

    # Redirección HTTP (Subject: HTTP redirection)
    location / {
        return 301 http://127.0.0.1:8080/;
    }

    location /old-page {
        return 302 /images;
    }
}